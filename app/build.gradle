plugins {
    id 'com.android.application'
}

android {
    namespace 'com.duhoktraffic.showroom'
    compileSdk 34

    defaultConfig {
        applicationId "com.duhoktraffic.showroom"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
