name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the Android platform used by the app
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep the APK (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: PlatesShowroom-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Also publish it as a release (direct download link)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PlatesShowroom.apk
          gh release create "apk-${{ github.run_number }}" PlatesShowroom.apk \
            --title "Showroom TV app (build ${{ github.run_number }})" \
            --notes "Install PlatesShowroom.apk on the TV."
